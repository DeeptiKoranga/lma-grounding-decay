# =============================================================================
# Surface-form aliases for the closed variable ontology
# =============================================================================
# OWNERSHIP: Track A owns this file from task A6 onward (PLAN_MIDSUB.md §1).
# Track B created this starter set so that the verifier rule layer (B6) could be
# built and tested against tests/fixtures/ before the real corpus existed.
# Extend it freely — the loader in src/verify/aliases.py is written to tolerate
# new variables, new surface forms and new top-level keys without a code change.
#
# WHAT THIS FILE IS FOR
#   Two consumers, one table:
#     * B6 rule layer — "does this passage mention both variables of the edge?"
#     * A6 BM25 alias expansion — widening a query to the words journalists use.
#
# HOW MATCHING WORKS (src/verify/aliases.py)
#   * Case-insensitive. "The rupee" at the start of a sentence and "the Rupee"
#     mid-sentence both match the INR_USD form `rupee`. Case-insensitivity here
#     is deliberate and is NOT the same relaxation as span matching, which keeps
#     casing significant (docs/decisions.md D-13).
#   * Whole words only, so `ATF` does not match inside `ATFX`.
#   * An optional plural or possessive suffix is tolerated: the form `carrier`
#     matches `carriers` and `carrier's`.
#   * Whitespace inside a form matches any run of whitespace, so a form may span
#     a line break in a PDF-extracted passage.
#   * Presentation characters are unified before matching (curly quotes, en and
#     em dashes, non-breaking spaces), so `carrier's` matches `carrier’s`.
#
# HOW TO ADD A FORM
#   Err towards recall, not precision. These forms gate *whether the verifier
#   looks at a passage at all*; the LLM verifier (B7) is what decides whether the
#   passage actually asserts the relation. A form that occasionally over-matches
#   costs one wasted verifier call. A missing form silently loses real evidence
#   and inflates the unsupported-edge rate.
#   The one thing not to do is add a form that belongs to a *different* ontology
#   variable. Bare `fuel` is left off ATF_PRICE on purpose: it reads equally as
#   FUEL_PRICES or CPI_FUEL_LIGHT, and letting it match all three would make the
#   "mentions both variables" rule meaningless for the whole energy group.
#
# ACCEPTED SHAPES — both of these load:
#   INR_USD: [rupee, the local unit]            # plain list of surface forms
#   INR_USD:                                    # mapping, for Track A's own keys
#     surface_forms: [rupee, the local unit]
#     expand_for_bm25: false
# Unknown top-level keys and unknown per-variable keys are ignored, so A6 can
# carry retrieval-only metadata here without breaking B6.
# =============================================================================

version: "0.1.0"
