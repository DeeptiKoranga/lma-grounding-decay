name: Track C portable checks
on:
  push:
    branches: [varun, "c/**", "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -o addopts="" -q --junitxml=test-results.xml
      - run: python -m ruff check .
      - run: python -m black --check .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-c-${{ matrix.os }}
          path: test-results.xml
