[project]
name = "lma-grounding-decay"
version = "0.1.0.dev0"
description = "Does Grounding Decay with Distance? Measuring and repairing weak links in LLM causal explanations of Indian macroeconomic news."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Varun Patil" },
    { name = "Harshal Bhansali" },
    { name = "Deepti Koranga" },
]

# Phase 0 keeps the runtime surface deliberately tiny: schemas, config loading and
# tests only. Anything that needs a GPU or an index lives in an optional extra so a
# fresh clone stays installable on a laptop in seconds.
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "black[jupyter]>=24.10",
    "pre-commit>=4.0",
]
# Track A / Track C pull these in from Phase 1 onward. Do NOT move anything here
# into [project.dependencies] without announcing it (see CONTRIBUTING.md).
heavy = [
    "torch>=2.5",
    "sentence-transformers>=3.3",
    "FlagEmbedding>=1.3",
    "faiss-cpu>=1.9",
    "rank-bm25>=0.2.2",
    "datasketch>=1.6",
    "vllm>=0.6",
    "mlx-lm>=0.20",
    "pymupdf>=1.24",
    "trafilatura>=2.0",
    "pandas>=2.2",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent",
    "src/conditions",
    "src/corpus",
    "src/eval",
    "src/extract",
    "src/llm",
    "src/retrieval",
    "src/schema",
    "src/tools",
    "src/verify",
]

[tool.hatch.build.targets.wheel.force-include]
"src/schema/ontology.yaml" = "schema/ontology.yaml"
"data/aliases.yaml" = "verify/aliases.yaml"

[tool.uv]
# `uv sync` should always give you the dev toolchain; heavy extras stay opt-in.
default-groups = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "slow: needs a GPU, a network fetch or the real corpus (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # black owns line length
    "RUF012", # pydantic/class-level mutable defaults are fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.black]
line-length = 100
target-version = ["py312"]
